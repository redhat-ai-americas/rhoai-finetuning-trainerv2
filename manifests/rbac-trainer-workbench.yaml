# RBAC for the Jupyter workbench ServiceAccount to submit and monitor Kubeflow
# Trainer v2 jobs from the notebook. Replace workbench-sa-placeholder via setup.sh.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banking-demo-trainer-workbench
  labels:
    app.kubernetes.io/part-of: rhoai-banking-support-demo
rules:
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["clustertrainingruntimes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: banking-demo-trainer-workbench
  labels:
    app.kubernetes.io/part-of: rhoai-banking-support-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: banking-demo-trainer-workbench
subjects:
  - kind: ServiceAccount
    name: workbench-sa-placeholder
    namespace: osft-banking-support-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-demo-trainer-workbench
  namespace: osft-banking-support-demo
  labels:
    app.kubernetes.io/part-of: rhoai-banking-support-demo
rules:
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainingruntimes", "trainjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-demo-trainer-workbench
  namespace: osft-banking-support-demo
  labels:
    app.kubernetes.io/part-of: rhoai-banking-support-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-demo-trainer-workbench
subjects:
  - kind: ServiceAccount
    name: workbench-sa-placeholder
    namespace: osft-banking-support-demo
